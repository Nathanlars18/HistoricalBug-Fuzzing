experiment_id: EXP007
assets:
  legacy_readme:
    path: experiment/EXP007_pattern_prompt_injection/README_legacy.md
  experiment_log:
    path: research_notes/experiments/EXP007.md
  baseline_harness:
    path: experiment/EXP007_pattern_prompt_injection/harnesses/baseline/main.cpp
  single_pattern_harness:
    path: experiment/EXP007_pattern_prompt_injection/harnesses/single_pattern/main.cpp
  raw_results:
    path: results/raw/EXP007/coverage_results.csv
  processed_results:
    path: results/processed/EXP007/
  generation_scripts:
    paths:
      - scripts/harness_generation/legacy/exp007_baseline.py
      - scripts/harness_generation/legacy/exp007_single_pattern.py
      - scripts/harness_generation/pattern_adapter.py
      - scripts/coverage/legacy/collect_exp007_coverage.py
  skipped_large_artifacts:
    - source: output_v1/
      reason: excluded output tree containing corpus artifacts
    - source: baseline/torch.matmul/corpus/
      reason: large fuzzing corpus
    - source: output/torch.matmul/corpus/
      reason: large fuzzing corpus
    - source: output/torch.matmul/fuzz
      reason: fuzzing binary
    - source: results/torch.matmul/logs/
      reason: large raw runtime logs; final coverage data retained
    - source: build, cache, profraw, and profdata artifacts
      reason: generated large artifacts excluded from migration
